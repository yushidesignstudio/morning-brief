# 每天台灣時間早上 8:00 自動更新早報
# UTC 00:00 = 台灣時間 08:00

name: Daily Morning Brief

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 執行
  workflow_dispatch:        # 允許手動觸發（測試用）

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate morning briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "Little Moss Bot"
          git config user.email "moss-bot@users.noreply.github.com"
          git add briefings.json
          # 只有在有變動時才 commit
          git diff --staged --quiet || git commit -m "🌅 Morning brief $(TZ='Asia/Taipei' date '+%Y-%m-%d')"
          git push
